# Kaggle / Colab-safe QLoRA fine-tuning configuration for Gemma 3 4B surveillance adaptation.

base_model_id: google/gemma-3-4b-it
output_dir: models/adapters/surveillance_colab

# Dataset JSONL generated by scripts/prepare_surveillance_sft_dataset.py
train_dataset: training/data/surveillance_train.jsonl
eval_dataset: training/data/surveillance_val.jsonl

# QLoRA / quantization
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: float16

# LoRA: narrower target set keeps memory use lower on T4 / P100 / Kaggle GPUs.
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Training
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
warmup_ratio: 0.03
max_seq_length: 512
logging_steps: 5
eval_steps: 1000
save_steps: 1000
save_total_limit: 1
max_grad_norm: 0.0

# Performance
gradient_checkpointing: true
bf16: false
fp16: true

resume_from_checkpoint: null