services:
  threat-detection:
    build: .
    container_name: drdo-threat-detection
    ports:
      - "7860:7860"
    volumes:
      - .:/app
    environment:
      - INFERENCE_BACKEND=${INFERENCE_BACKEND:-ollama}
      - ACTIVE_ADAPTER=${ACTIVE_ADAPTER:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - HF_TOKEN=${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Required to allow container-to-host Ollama API calls
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
